name: Android app

on:
  push:
    branches: [main, master]
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["app-v*"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write  # attach the APK to the release on app-v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Optional, but needed for updates: without a stable key every CI build is signed with a
      # different debug key and Android refuses to update the installed app.
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || format('0.1.0-{0}', github.run_number) }}
        run: |
          VERSION_NAME="${VERSION_NAME#app-v}" gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "tile2ha-${VERSION_NAME#app-v}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tile2ha-apk
          path: android/tile2ha-*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/tile2ha-*.apk
